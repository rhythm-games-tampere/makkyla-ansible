# Managed by Ansible (roles/pipewire).
# Fixed rate and cycle length so ITGmania's JACK output has the same latency
# every session. 512 frames @ 48 kHz = 10.7 ms. Retune GlobalOffsetSeconds if changed.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 512
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 512
}
