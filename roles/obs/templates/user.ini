; Managed by Ansible (roles/obs). Reset on every OBS start by start-obs.sh.

[General]
; Suppresses the auto-configuration wizard.
FirstRun=true

[Basic]
Profile=makkyla
ProfileDir=makkyla
SceneCollection=makkyla
SceneCollectionFile=makkyla

[BasicWindow]
SysTrayEnabled=true
SysTrayWhenStarted=true
SysTrayMinimizeToTray=true

; DistroAV NDI main output (program feed), started automatically.
[NDIPlugin]
MainOutputEnabled=true
; Receivers see the source as "<HOSTNAME> (ITGmania)".
MainOutputName=ITGmania
; Empty = public.
MainOutputGroups=
PreviewOutputEnabled=false
TallyProgramEnabled=false
TallyPreviewEnabled=false
