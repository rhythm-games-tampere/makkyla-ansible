## MAIN BUILD

- name: Install ITGmania build dependencies
  apt:
    package: libasound2-dev,libgl-dev,libglu1-mesa-dev,libgtk-3-dev,libjack-dev,libmad0-dev,libpulse-dev,libudev-dev,libxinerama-dev,libx11-dev,libxrandr-dev,libxtst-dev,nasm,cmake,build-essential,git,nfs-common

- name: Copy NAS unmount script
  copy:
    src: files/unmountnas.sh
    dest: /home/mckyla/unmountnas.sh
    mode: 0755
    owner: mckyla
    group: mckyla

# Unmount because some of the mounts are inside the theme directories and the git task fails to run
# when it thinks there are local modifications.
- name: Unmount NAS shares before remounting
  command: /home/mckyla/unmountnas.sh
  changed_when: false
  failed_when: false

- name: Make sure /opt/itgmania is owned by mckyla (was owned by root before)
  file:
    path: /opt/itgmania
    owner: mckyla
    group: mckyla
    recurse: yes
    state: directory

- name: Fetch ITGmania source
  git:
    repo: https://github.com/rhythm-games-tampere/itgmania
    dest: /opt/itgmania
    version: stable
    recursive: yes
  register: source
  diff: false
  become_user: mckyla

# Minimaid is disabled because the bundled libmmmagic static library is x86-only,
# which breaks arm64 builds. We don't use Minimaid hardware anyway (LightsDriver="").
# Upstream ITGmania replaced libmmmagic with hidapi in PR #946 (merged to beta Aug 2025).
# TODO: Once our fork merges upstream beta (which includes PR #946), this flag can be removed.
- name: Run CMake
  shell: cmake -B Build -DWITH_FFMPEG_JOBS=$(nproc) -DWITH_MINIMAID=OFF
  args:
    chdir: /opt/itgmania
  when: source.changed

- name: Compile ITGmania
  shell: cmake --build Build --parallel $(nproc)
  args:
    chdir: /opt/itgmania
  when: source.changed

## THEME AND CONFIGURATION

- name: Make sure content directory exists
  file:
    path: /home/mckyla/stepmania-content
    state: directory
    owner: mckyla
    group: mckyla

- name: Get Simply Love
  git:
    repo: https://github.com/rhythm-games-tampere/simplylove
    dest: /home/mckyla/stepmania-content/Themes/simplylove
    version: stable
  become_user: mckyla
  diff: false

- name: Make sure Save directory exists
  file:
    path: /home/mckyla/.itgmania/Save
    state: directory
    owner: mckyla
    group: mckyla

- name: Copy Preferences.ini
  copy:
    src: files/Preferences-standard.ini
    dest: /home/mckyla/Preferences-standard.ini
    mode: 0644
    owner: mckyla
    group: mckyla

- name: Copy ThemePrefs.ini
  copy:
    src: files/ThemePrefs-standard.ini
    dest: /home/mckyla/ThemePrefs-standard.ini
    mode: 0644
    owner: mckyla
    group: mckyla

## STARTUP AND DESKTOP ICONS

- name: Copy startup script
  copy:
    src: files/start-itgmania.sh
    dest: /home/mckyla/start-itgmania.sh
    mode: 0755
    owner: mckyla
    group: mckyla

- name: Make sure Desktop folder exists
  file:
    path: /home/mckyla/Desktop
    owner: mckyla
    group: mckyla
    state: directory

- name: Add ITGmania icon to desktop
  copy:
    src: files/itgmania.desktop
    dest: /home/mckyla/Desktop/itgmania.desktop
    mode: 0755
    owner: mckyla
    group: mckyla

- name: Add NAS shares to fstab
  ansible.posix.mount:
    src: "192.168.11.3:/volume1/{{ item.share }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: defaults,nofail,_netdev,rw,nfsvers=3
    state: present
  loop:
    - { share: Songs,         path: /home/mckyla/stepmania-content/Songs }
    - { share: LocalProfiles, path: /home/mckyla/.itgmania/Save/LocalProfiles }
    - { share: Courses,       path: /home/mckyla/stepmania-content/Courses }
    - { share: NoteSkins,     path: /home/mckyla/.itgmania/NoteSkins }
    - { share: Judgments,     path: /home/mckyla/stepmania-content/Themes/simplylove/Graphics/_judgments }
    - { share: HoldJudgments, path: /home/mckyla/stepmania-content/Themes/simplylove/Graphics/_HoldJudgments }

- name: Copy NAS mount script
  copy:
    src: files/mountnas.sh
    dest: /home/mckyla/mountnas.sh
    mode: 0755
    owner: mckyla
    group: mckyla

- name: Add Mount NAS icon to desktop
  copy:
    src: "files/Mounttaa NAS.desktop"
    dest: "/home/mckyla/Desktop/Mounttaa NAS.desktop"
    mode: 0755
    owner: mckyla
    group: mckyla

- name: Add Unmount NAS icon to desktop
  copy:
    src: "files/Unmounttaa NAS.desktop"
    dest: "/home/mckyla/Desktop/Unmounttaa NAS.desktop"
    mode: 0755
    owner: mckyla
    group: mckyla

- name: Copy Keymaps.ini over
  copy:
    src: files/Keymaps.ini
    dest: /home/mckyla/.itgmania/Save/Keymaps.ini
    mode: 0755
    owner: mckyla
    group: mckyla

- name: Make sure Songs folder exists
